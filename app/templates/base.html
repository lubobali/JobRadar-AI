<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}JobRadar-AI{% endblock %}</title>
<style>
/* ---------------------------------------------------------------------------
   Palette carried over from LuBot so the two look like one person's work.
   Everything is a token: the difference between a page that looks designed and
   one that looks assembled is usually just that the greys agree with each other.
--------------------------------------------------------------------------- */
:root {
  --bg:          #0a0e1a;
  --surface:     #131a2e;
  --surface-2:   #182136;
  --border:      #1e2a45;
  --border-lit:  #2b3b5e;

  --text:        #e8edf7;
  --text-dim:    #9aa8c4;
  --text-faint:  #64739180;

  --accent:      #5b9dff;
  --accent-dim:  #2b6fd4;
  --good:        #4ade80;
  --warn:        #fbbf24;
  --bad:         #f87171;

  --radius:      10px;
  --radius-sm:   6px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 40px;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

/* --- header ------------------------------------------------------------- */

header {
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: blur(8px);
}
.header-row {
  display: flex; align-items: center; gap: 28px;
  height: 64px;
}
.brand {
  font-size: 17px; font-weight: 650; letter-spacing: -0.01em;
  color: var(--text); white-space: nowrap;
}
.brand span { color: var(--accent); }

nav { display: flex; gap: 4px; }
nav a {
  padding: 7px 14px; border-radius: var(--radius-sm);
  color: var(--text-dim); font-size: 14px; font-weight: 500;
  text-decoration: none; transition: background .12s, color .12s;
}
nav a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
nav a.on { background: var(--accent-dim); color: #fff; }

.counts { margin-left: auto; font-size: 12.5px; color: var(--text-faint); }

/* --- search + filters --------------------------------------------------- */

.searchbar { margin: 28px 0 14px; }
.searchbar input[type=search] {
  width: 100%; padding: 13px 16px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 15px; outline: none; transition: border-color .12s;
}
.searchbar input[type=search]:focus { border-color: var(--accent-dim); }
.searchbar input::placeholder { color: var(--text-faint); }

.filters {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin-bottom: 22px; font-size: 13px; color: var(--text-dim);
}
.filters select, .filters input[type=number] {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 6px 9px; font-size: 13px; outline: none;
}
.filters label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.filters button {
  background: var(--accent-dim); color: #fff; border: 0;
  padding: 7px 15px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; cursor: pointer;
}
.filters button:hover { background: var(--accent); }
.filters .clear { color: var(--text-faint); }

.resultcount {
  font-size: 13px; color: var(--text-dim); margin-bottom: 14px;
  display: flex; align-items: baseline; gap: 8px;
}
.resultcount strong { color: var(--text); font-size: 15px; font-weight: 600; }

/* --- job cards ---------------------------------------------------------- */

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px;
  transition: border-color .12s;
}
.card:hover { border-color: var(--border-lit); }

.card-head { display: flex; gap: 14px; align-items: flex-start; }

.score {
  flex: 0 0 auto; width: 46px; height: 46px; border-radius: var(--radius-sm);
  display: grid; place-items: center;
  font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums;
  background: var(--surface-2); color: var(--text-dim);
  border: 1px solid var(--border);
}
.score.s-high { color: var(--good);   border-color: #4ade8033; background: #4ade8010; }
.score.s-mid  { color: var(--warn);   border-color: #fbbf2433; background: #fbbf2410; }
.score.s-low  { color: var(--text-dim); }
.score.s-none { color: var(--text-faint); font-size: 12px; font-weight: 500; }

.card-title { font-size: 15.5px; font-weight: 600; margin: 0 0 3px; letter-spacing: -0.01em; }
.card-title a { color: var(--text); }
.card-meta { font-size: 13px; color: var(--text-dim); }
.card-meta .sep { color: var(--text-faint); margin: 0 7px; }
.tag {
  display: inline-block; padding: 1px 7px; border-radius: 4px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: 11.5px; color: var(--text-dim); margin-left: 8px;
}
.tag.remote { color: var(--good); border-color: #4ade8033; }
.tag.applied { color: var(--accent); border-color: #5b9dff33; }

.reason {
  margin-top: 9px; font-size: 13px; color: var(--text-dim);
  line-height: 1.55; border-left: 2px solid var(--border-lit); padding-left: 11px;
}
.matched {
  margin-top: 9px; font-size: 12.5px; color: var(--text-faint);
  font-style: italic; line-height: 1.5;
}

.card-actions { display: flex; gap: 8px; margin-top: 12px; }
button.act {
  background: var(--surface-2); color: var(--text-dim);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 6px 13px; font-size: 12.5px; font-weight: 500; cursor: pointer;
  transition: all .12s;
}
button.act:hover { border-color: var(--border-lit); color: var(--text); }
button.act.done { color: var(--good); border-color: #4ade8033; background: #4ade8010; }
button.act:disabled { opacity: .5; cursor: default; }

/* --- tables (Applied) --------------------------------------------------- */

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  text-align: left; padding: 9px 12px; font-size: 12px; font-weight: 600;
  color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em;
  border-bottom: 1px solid var(--border);
}
td { padding: 13px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:hover td { background: #131a2e66; }

select.status {
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 5px 8px; font-size: 12.5px; cursor: pointer;
}
.st-offer      { color: var(--good); }
.st-rejected,
.st-withdrawn  { color: var(--text-faint); }
.st-interviewing,
.st-screening  { color: var(--warn); }

.notes { margin-top: 8px; font-size: 12.5px; color: var(--text-dim); }
.notes div { padding: 3px 0; }
.notes .when { color: var(--text-faint); margin-right: 8px; font-variant-numeric: tabular-nums; }

/* --- job detail --------------------------------------------------------- */

.detail-head { margin: 28px 0 20px; }
.detail-head h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.02em; }
.description {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px 24px;
  white-space: pre-wrap; line-height: 1.7; font-size: 14.5px; color: #cdd6e8;
}

.empty {
  text-align: center; padding: 64px 20px; color: var(--text-faint); font-size: 14px;
}
.pager { display: flex; gap: 8px; justify-content: center; margin: 26px 0 8px; }
.pager a, .pager span {
  padding: 7px 13px; border-radius: var(--radius-sm); font-size: 13px;
  border: 1px solid var(--border); color: var(--text-dim);
}
.pager span { color: var(--text-faint); border-color: transparent; }
</style>
</head>
<body>

<header>
  <div class="wrap header-row">
    <div class="brand">Job<span>Radar</span></div>
    <nav>
      <a href="/"        class="{{ 'on' if tab == 'search'  }}">Search</a>
      <a href="/saved"   class="{{ 'on' if tab == 'saved'   }}">Saved</a>
      <a href="/applied" class="{{ 'on' if tab == 'applied' }}">Applied</a>
      <a href="/chat"    class="{{ 'on' if tab == 'chat'    }}">Ask</a>
    </nav>
    <div class="counts" id="counts"></div>
  </div>
</header>

<main class="wrap">
  {% block body %}{% endblock %}
</main>

<script>
// One helper for every write on the page. They all POST JSON and all return
// JSON, including on failure - which is why the error handler on the server
// never renders HTML for /api/ paths.
async function post(path, body) {
  const response = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({error: "unreadable response"}));
  if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
  return data;
}

async function save(button, jobId) {
  const unsave = button.classList.contains("done");
  try {
    await post("/api/save", {job_id: jobId, unsave});
    button.classList.toggle("done", !unsave);
    button.textContent = unsave ? "Save" : "Saved";
  } catch (err) { alert(err.message); }
}

async function apply(button, jobId) {
  try {
    const data = await post("/api/apply", {job_id: jobId, status: "applied"});
    button.classList.add("done");
    button.textContent = "Applied";
    button.disabled = true;
  } catch (err) { alert(err.message); }
}

async function setStatus(select, applicationId) {
  try {
    await post("/api/status", {application_id: applicationId, status: select.value});
    select.className = "status st-" + select.value;
  } catch (err) { alert(err.message); }
}

async function addNote(applicationId) {
  const note = prompt("Note");
  if (!note) return;
  try { await post("/api/note", {application_id: applicationId, note}); location.reload(); }
  catch (err) { alert(err.message); }
}

// Counts come from /status, not /healthz. Databricks Apps intercepts /healthz
// for its own probing, so a page asking it for counts gets the platform's
// answer and shows nothing on a perfectly healthy app.
fetch("/status").then(r => r.json()).then(d => {
  if (!d.counts) return;
  const c = d.counts;
  document.getElementById("counts").textContent =
    c.jobs.toLocaleString() + " jobs · " + c.embeddings.toLocaleString() + " vectors · " +
    c.scores.toLocaleString() + " scored";
}).catch(() => {});

{% block script %}{% endblock %}
</script>
</body>
</html>
