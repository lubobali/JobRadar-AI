# Tooling config, plus the minimum packaging metadata needed to pip-install
# this from git.
#
# Runtime dependencies still live in requirements.txt / requirements-dev.txt and
# are deliberately NOT declared here, so prod, CI and local all resolve from one
# pinned file. `[project].dependencies` is left empty on purpose.
#
# Why packaging exists at all: Databricks serverless compute has no
# SparkContext, so `addPyFile` is unavailable and there is no way to ship a zip
# to the executors. A notebook-scoped `%pip install git+...` is the supported
# route, and that needs the repo to be installable.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar"
version = "0.1.0"
description = "AI job hunting copilot: Spark ingest, pgvector matching, and an MCP agent."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobradar = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return consistency
    "PTH",  # use pathlib
    "ANN",  # require type annotations
    "TID",  # tidy imports
    "PL",   # pylint
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Asserts and magic values are the point of a test.
"tests/**" = ["PLR2004", "S101"]
# Every function in this module takes whatever the model sent and decides
# whether it is usable. `Any` is the subject, not an omission.
"mcp_server/validation.py" = ["ANN401"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.pytest.ini_options]
# src layout: tests import `jobradar` without installing the package. The MCP
# server and the Flask app are their own deploy units, so their directories go
# on the path too - exactly how each one imports at runtime.
pythonpath = ["src", "mcp_server", "app"]
testpaths = ["tests", "src"]
addopts = [
    "--doctest-modules",   # pure functions carry doctests
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "fast: every external boundary mocked (the default)",
    "live: hits a real job API, a real Lakebase, or a deployed MCP server",
]
filterwarnings = [
    # A warning is how pytest reports a test it could not collect (PytestCollectionWarning).
    # Left as a warning it scrolls past and the suite still says "passed" — which is exactly
    # how ~50 tests stayed dead for two days. See tests/test_collection_guard.py.
    "error",
]
