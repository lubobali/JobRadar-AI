# Tooling config, plus the minimum packaging metadata needed to pip-install
# this from git.
#
# Runtime dependencies still live in requirements.txt / requirements-dev.txt and
# are deliberately NOT declared here, so prod, CI and local all resolve from one
# pinned file. `[project].dependencies` is left empty on purpose.
#
# Why packaging exists at all: Databricks serverless compute has no
# SparkContext, so `addPyFile` is unavailable and there is no way to ship a zip
# to the executors. A notebook-scoped `%pip install git+...` is the supported
# route, and that needs the repo to be installable.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar"
# BUMP THIS whenever src/jobradar changes and the Databricks App or a notebook
# needs the change. Both install the package from git, and pip resolves
# `jobradar @ git+...` against the version ALREADY INSTALLED: same version means
# "requirement already satisfied", so it silently keeps the old code.
#
# The App ships app/ as source but src/jobradar through pip, so a change to one
# deploys and a change to the other does not. That asymmetry has now caused two
# crashes, both of which read as "App built successfully" followed immediately
# by "App crashed at startup" - because the module the app imports was never
# installed.
#
# 0.4.0: adds jobradar.drafting.
version = "0.4.0"
description = "AI job hunting copilot: Spark ingest, pgvector matching, and an MCP agent."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobradar = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return consistency
    "PTH",  # use pathlib
    "ANN",  # require type annotations
    "TID",  # tidy imports
    "PL",   # pylint
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Asserts and magic values are the point of a test.
"tests/**" = ["PLR2004", "S101"]
# Every function in this module takes whatever the model sent and decides
# whether it is usable. `Any` is the subject, not an omission.
"mcp_server/validation.py" = ["ANN401"]
# Databricks notebooks source-controlled as .py. These are not modules; they are
# a cell sequence the notebook runtime executes top to bottom, and four of its
# rules do not survive the translation:
#
#   F821  `spark` and `dbutils` are injected into the notebook's globals by the
#         runtime. Importing them locally would shadow the real ones.
#   E402  Imports MUST come after the `%pip install` cell and the
#         `dbutils.library.restartPython()` that follows it. Moving them to the
#         top means importing a package that is about to be reinstalled under a
#         Python that is about to be restarted.
#   PLC0415  Same reason, stated as "import not at top level".
#   ANN     Cell-level helpers are read inline next to their only call site.
#
# Everything else stays on, so a genuine unused import or shadowed builtin in a
# notebook is still an error. This is scoped, not switched off.
#   N812  `from pyspark.sql import functions as F` is PySpark's own convention,
#         used in its documentation and in every Spark codebase.
#   PLR0913/0917  A Spark UDF's signature is dictated by the DataFrame columns
#         it is applied to. `fetch` takes eight arguments because a source spec
#         has eight fields; collapsing them into one struct to satisfy a linter
#         would make the call site worse.
"notebooks/**" = [
    "F821", "E402", "PLC0415", "ANN001", "ANN201", "N812", "PLR0913", "PLR0917",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.pytest.ini_options]
# src layout: tests import `jobradar` without installing the package. The MCP
# server and the Flask app are their own deploy units, so their directories go
# on the path too - exactly how each one imports at runtime.
pythonpath = ["src", "mcp_server", "app"]
testpaths = ["tests", "src"]
addopts = [
    "--doctest-modules",   # pure functions carry doctests
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "fast: every external boundary mocked (the default)",
    "live: hits a real job API, a real Lakebase, or a deployed MCP server",
]
filterwarnings = [
    # A warning is how pytest reports a test it could not collect (PytestCollectionWarning).
    # Left as a warning it scrolls past and the suite still says "passed" — which is exactly
    # how ~50 tests stayed dead for two days. See tests/test_collection_guard.py.
    "error",
]
